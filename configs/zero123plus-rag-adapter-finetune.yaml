model:
  base_learning_rate: 1.0e-05
  target: zero123plus.model.MVDiffusion
  params:
    drop_cond_prob: 0.1
    enable_rag_adapter: true
    rag_token_scale: 0.1
    rag_global_scale: 0.05
    rag_match_scale: 1.0
    rag_near_scale: 0.35
    rag_nonmatch_scale: 0.05
    rag_unknown_scale: 0.1
    rag_train_adapter_only: true
    rag_unfreeze_crossattn: false
    rag_debug_dump: true

    stable_diffusion_config:
      pretrained_model_name_or_path: sudo-ai/zero123plus-v1.2
      custom_pipeline: ./zero123plus

data:
  target: src.data.objaverse_zero123plus.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 4
    train:
      target: src.data.objaverse_zero123plus.ManifestRAGZero123PlusData
      params:
        root_dir: data/rag_zero123plus
        manifest_fname: train.jsonl
        validation: false
    validation:
      target: src.data.objaverse_zero123plus.ManifestRAGZero123PlusData
      params:
        root_dir: data/rag_zero123plus
        manifest_fname: train.jsonl
        validation: true

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 1000
      save_top_k: -1
      save_last: true
  callbacks: {}

  trainer:
    benchmark: true
    max_epochs: -1
    gradient_clip_val: 1.0
    val_check_interval: 1000
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    check_val_every_n_epoch: null
