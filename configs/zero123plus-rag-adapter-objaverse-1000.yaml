model:
  base_learning_rate: 1.0e-05
  target: zero123plus.model.MVDiffusion
  params:
    drop_cond_prob: 0.0
    enable_rag_adapter: true
    rag_token_scale: 0.1
    rag_global_scale: 0.05
    rag_match_scale: 1.0
    rag_near_scale: 0.35
    rag_nonmatch_scale: 0.05
    rag_unknown_scale: 0.1
    rag_train_adapter_only: true
    rag_unfreeze_crossattn: false
    rag_spatial_gating: true
    rag_spatial_gate_scale: 1.0
    rag_debug_dump: false
    rag_debug_metrics_enabled: true
    rag_debug_metrics_interval: 20
    rag_debug_metrics_filename: rag_debug_metrics.jsonl
    rag_post_train_smoke_test: true
    rag_post_train_smoke_steps: 100
    rag_smoke_test_cond_image: images/nice.jpg
    rag_smoke_test_ref_dir: folder
    rag_smoke_test_metadata: folder/ref_metadata.json
    rag_smoke_test_num_inference_steps: 15
    rag_smoke_test_seed: 42
    rag_smoke_test_include_strong_scale: true
    train_debug_image_interval: 500

    stable_diffusion_config:
      pretrained_model_name_or_path: sudo-ai/zero123plus-v1.2
      custom_pipeline: ./zero123plus

data:
  target: src.data.objaverse_zero123plus.DataModuleFromConfig
  params:
    batch_size: 1
    num_workers: 4
    train:
      target: src.data.objaverse_zero123plus.ManifestRAGZero123PlusData
      params:
        root_dir: data/rag_zero123plus_objaverse_toys
        manifest_fname: train.jsonl
        validation: false
        validation_reserve: 0
        num_refs: 3
        zero123plus_pose_version: v1.2
    validation:
      target: src.data.objaverse_zero123plus.ManifestRAGZero123PlusData
      params:
        root_dir: data/rag_zero123plus_objaverse_toys
        manifest_fname: val.jsonl
        validation: true
        validation_reserve: 0
        num_refs: 3
        zero123plus_pose_version: v1.2

lightning:
  disable_full_checkpoints: true
  adapter_only_checkpoint:
    enabled: true
    save_steps: [500]
    save_last: true
  callbacks: {}

  trainer:
    benchmark: false
    max_steps: 1000
    max_epochs: -1
    gradient_clip_val: 1.0
    limit_val_batches: 0
    val_check_interval: 1000000
    num_sanity_val_steps: 0
    accumulate_grad_batches: 1
    check_val_every_n_epoch: null
